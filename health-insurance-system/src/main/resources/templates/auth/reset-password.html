<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Health Insurance System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="container">
        <div class="card auth-box">
            <div class="auth-header">
                <h2>Set New Password</h2>
                <p>Enter your reset token and new password</p>
            </div>

            <div id="alert-box" style="display: none;" class="alert"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="token">Reset Token</label>
                    <input type="text" id="token" class="form-control" th:value="${token}" placeholder="Paste reset token here" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="At least 6 characters" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update Password</button>
            </form>

            <div style="margin-top: 20px; text-align: center; font-size: 14px;">
                <a th:href="@{/login}" style="color: var(--primary);">Back to Login</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'none';

            const payload = {
                token: document.getElementById('token').value.trim(),
                newPassword: document.getElementById('newPassword').value
            };

            fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Password reset failed');
                }
                alertBox.className = 'alert alert-success';
                alertBox.textContent = data.message;
                alertBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            })
            .catch(error => {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = error.message;
                alertBox.style.display = 'block';
            });
        });
    </script>
</body>
</html>
