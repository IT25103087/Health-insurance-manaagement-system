<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Health Insurance System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="container">
        <div class="card auth-box">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Enter your registered email address to receive reset instructions</p>
            </div>

            <div id="alert-box" style="display: none;" class="alert"></div>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Registered Email</label>
                    <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Generate Reset Token</button>
            </form>

            <div id="token-display" style="display: none; margin-top: 20px;" class="alert alert-info">
                <strong>Reset Token Generated:</strong>
                <p id="generated-token" style="word-break: break-all; margin: 8px 0; font-family: monospace;"></p>
                <a id="reset-link" href="#" class="btn btn-sm btn-success">Proceed to Reset Password</a>
            </div>

            <div style="margin-top: 20px; text-align: center; font-size: 14px;">
                <a th:href="@{/login}" style="color: var(--primary);">Back to Login</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            const tokenDisplay = document.getElementById('token-display');
            alertBox.style.display = 'none';
            tokenDisplay.style.display = 'none';

            const payload = {
                email: document.getElementById('email').value.trim()
            };

            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Request failed');
                }
                alertBox.className = 'alert alert-success';
                alertBox.textContent = data.message;
                alertBox.style.display = 'block';

                document.getElementById('generated-token').textContent = data.resetToken;
                document.getElementById('reset-link').href = '/reset-password?token=' + encodeURIComponent(data.resetToken);
                tokenDisplay.style.display = 'block';
            })
            .catch(error => {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = error.message;
                alertBox.style.display = 'block';
            });
        });
    </script>
</body>
</html>
